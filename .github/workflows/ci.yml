name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: node scripts/build-hook.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: node scripts/build-hook.mjs
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy -p peeps-desktop --all-targets -- -D warnings 2> clippy.log; then
            python3 -c "t=open('clippy.log').read().splitlines()[-60:]; print('::error title=clippy::' + '%0A'.join(l.replace('%','%25') for l in t))"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No modules that differ only in case
        run: |
          clashes=$(git ls-files 'src/*.ts' 'src/*.tsx' 'e2e/*.ts' | sed -E 's/\.tsx?$//' | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$clashes" ]; then echo "::error::Clash on macOS and Windows: $clashes"; exit 1; fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # The e2e tests use the preview's demo data, so this is the only check that the real backend
  # gets the window drawn.
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm run build
      - run: node scripts/build-hook.mjs
      # Without custom-protocol the app loads the dev server instead of the built interface.
      - run: cargo build -p peeps-desktop --features tauri/custom-protocol
      - run: xvfb-run -a npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke
          path: test-results/app-smoke.png
          if-no-files-found: ignore
