name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: node scripts/build-hook.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: node scripts/build-hook.mjs
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy -p peeps-desktop --all-targets -- -D warnings 2> clippy.log; then
            python3 -c "import re,sys; t=open('clippy.log').read(); m=[b for b in re.split(r'\n(?=error|warning)', t) if b.startswith(('error','warning'))][:4]; print('::error title=clippy::' + '\n\n'.join(m).replace('%','%25').replace('\n','%0A'))"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
